[tool.poetry]
name = "reference-mcp-server"
version = "0.1.0"
description = "Reference service health foundation"
authors = ["PeopleOps AI"]
packages = [{ include = "reference_mcp_server", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.36"
psycopg = {version = "^3.2.3", extras = ["binary"]}
alembic = "^1.14.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
