[tool.poetry]
name = "peopleops-api"
version = "0.1.0"
description = "PeopleOps AI API foundation"
authors = ["PeopleOps AI"]
packages = [{ include = "peopleops_api", from = "src" }]
include = [
    { path = "src/peopleops_api/resources/**/*.md", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.36"
psycopg = {version = "^3.2.3", extras = ["binary"]}
alembic = "^1.14.0"
uvicorn = {version = "^0.31.1", extras = ["standard"]}
langgraph = "^0.2.50"
openai = "^1.54.0"
llama-index-core = "^0.12.23"
llama-index-readers-file = "^0.4.6"
llama-index-embeddings-openai = "^0.3.1"
pgvector = "^0.3.6"
pypdf = "^5.3.1"
python-multipart = "^0.0.18"
mcp = {extras = ["cli"], version = "^2.1.1"}
langchain-core = "^0.3.76"
langchain-openai = "^0.3.35"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "../reference-mcp-server/src"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
